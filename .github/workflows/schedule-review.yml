name: Verify task filters and scheduled starts
on:
  push:
    branches: [main]
    paths: ['.schedule-update/**', '.github/workflows/schedule-review.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schedule-review-promotion
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_REPLACE_REGISTRY_HOST: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - name: Apply checksum-verified change
        run: |
          mkdir -p "$RUNNER_TEMP/schedule-review"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {brotliDecompressSync} from 'node:zlib';
          import {execFileSync} from 'node:child_process';
          const m=JSON.parse(fs.readFileSync('.schedule-update/manifest.json','utf8'));
          execFileSync('git',['merge-base','--is-ancestor',m.base,'HEAD']);
          const safe=p=>!path.isAbsolute(p)&&!p.split('/').includes('..')&&!p.startsWith('-');
          if(!m.allowed.every(safe)) throw Error('Invalid paths');
          const chunks=Array.from({length:m.parts},(_,i)=>fs.readFileSync(`.schedule-update/part-${String(i).padStart(2,'0')}.b64`,'utf8'));
          const patch=brotliDecompressSync(Buffer.from(chunks.join(''),'base64'));
          if(crypto.createHash('sha256').update(patch).digest('hex')!==m.sha256) throw Error('Patch checksum mismatch');
          const target=path.join(process.env.RUNNER_TEMP,'schedule-review/source.patch');fs.writeFileSync(target,patch);
          execFileSync('git',['apply','--unidiff-zero','--check',target]);
          execFileSync('git',['apply','--unidiff-zero','--index',target]);
          for(const p of fs.readdirSync('.schedule-update').filter(p=>/^fix-.*\.patch$/.test(p)).sort()) execFileSync('git',['apply','--index',`.schedule-update/${p}`]);
          const changed=execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split('\n');
          if(changed.some(p=>!m.allowed.includes(p))) throw Error('Unexpected source change');
          JS
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-schedule-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-review-cargo-
            ${{ runner.os }}-chat-cargo-
            ${{ runner.os }}-cargo-
      - name: Test and build macOS development package
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
          make test build-dmg 2>&1 | tee "$RUNNER_TEMP/schedule-review/test-build.log"
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Promote verified implementation
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          m=json.loads(pathlib.Path('.schedule-update/manifest.json').read_text())
          existing=[p for p in m['allowed'] if pathlib.Path(p).exists()]
          subprocess.run(['git','add','--',*existing],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if set(changed)-set(m['allowed']): raise SystemExit('Unexpected staged source')
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'Main changed; refusing to overwrite newer work'; exit 1; }
          git rm -r .schedule-update .github/workflows/schedule-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: persistent task filters, scheduled starts and Codex configuration preflight'
          git push origin HEAD:main
          git rev-parse HEAD | tee "$RUNNER_TEMP/schedule-review/implementation-commit.txt"
      - name: Collect source and diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/schedule-review"
          tar -czf "$RUNNER_TEMP/schedule-review/source.tar.gz" --exclude=target --exclude=node_modules --exclude=dist src-tauri src-ui scripts docs Makefile
          git status --short > "$RUNNER_TEMP/schedule-review/git-status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-review-verification
          path: ${{ runner.temp }}/schedule-review
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: codex-thread-kanban-scheduled-start
          path: src-tauri/target/release/bundle/dmg/*_development.dmg*
          if-no-files-found: error
