name: Verify whole-tree keyword search
on:
  push:
    branches: [main]
    paths: ['.keyword-update/**', '.github/workflows/keyword-review.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keyword-search-promotion
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_REPLACE_REGISTRY_HOST: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - name: Apply checked source patch
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          patch = pathlib.Path('.keyword-update/source.patch')
          expected = '143f84abff5fd47e496869c180374046995e5fc7d15f9ba6088e6c0d53eab3e1'
          if hashlib.sha256(patch.read_bytes()).hexdigest() != expected:
              raise SystemExit('Source patch checksum mismatch')
          subprocess.run(['git', 'merge-base', '--is-ancestor', '8f487603caba304f133c64036c2a3197bca47eff', 'HEAD'], check=True)
          subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          allowed = {
              'docs/agent/coding.md', 'docs/agent/testing.md',
              'docs/changes/2026-10-28-scheduling-filters.md',
              'src-ui/src/studio/ChatApp.test.tsx',
              'src-ui/src/studio/TaskFilterBar.tsx', 'src-ui/src/studio/TaskTree.tsx',
              'src-ui/src/studio/taskFilters.ts', 'src-ui/src/studio/taskFilters.test.ts',
              'src-ui/src/studio/taskFilters.keyword.test.ts',
          }
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          if set(changed) != allowed:
              raise SystemExit('Unexpected source paths')
          PY
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-schedule-cargo-
            ${{ runner.os }}-review-cargo-
            ${{ runner.os }}-cargo-
      - name: Test and verify macOS package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/keyword-review"
          git diff --cached --check
          make test build-dmg 2>&1 | tee "$RUNNER_TEMP/keyword-review/test-build.log"
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Promote tested implementation
        shell: bash
        run: |
          git diff --exit-code
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'Main changed; refusing to overwrite'; exit 1; }
          git rm -r .keyword-update .github/workflows/keyword-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keyword search selects complete task trees before node filters'
          git push origin HEAD:main
          git rev-parse HEAD > "$RUNNER_TEMP/keyword-review/implementation-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyword-search-verification
          path: ${{ runner.temp }}/keyword-review
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: codex-thread-kanban-keyword-search
          path: src-tauri/target/release/bundle/dmg/*_development.dmg*
          if-no-files-found: error
