name: Verify and apply chat workspace
on:
  push:
    branches: [main]
    paths: ['.chat-update/**', '.github/workflows/apply-chat-workspace.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chat-workspace-promotion
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_REPLACE_REGISTRY_HOST: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checksum-verified source change
        id: source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/chat-verification"
          if [ ! -f .chat-update/manifest.json ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          root = pathlib.Path('.chat-update')
          m = json.loads((root/'manifest.json').read_text())
          subprocess.run(['git','merge-base','--is-ancestor',m['base'],'HEAD'],check=True)
          chunks = [(root/f'part-{i:02}.b64').read_text() for i in range(m['parts'])]
          # Normalize the one identified transport transcription, then verify the
          # complete source patch against its locally tested SHA-256.
          chunks[4] = chunks[4].replace('FdDkD3l1lx31','FdDkD311lx31')
          patch = lzma.decompress(base64.b64decode(''.join(chunks),validate=True))
          if hashlib.sha256(patch).hexdigest() != m['sha256']:
              raise SystemExit('Source patch checksum mismatch')
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'chat-verification/source.patch'
          p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          for fix in sorted(root.glob('fix-*.patch')):
              subprocess.run(['git','apply','--index',str(fix)],check=True)
          changed = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if set(changed)-set(m['allowed']):
              raise SystemExit('Unexpected source path in verified change')
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'chat-verification/paths.json').write_text(json.dumps(changed))
          PY
          echo 'present=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.source.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - name: Rust toolchain
        if: steps.source.outputs.present == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - uses: actions/cache@v4
        if: steps.source.outputs.present == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-chat-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Format, test, build, and verify local package
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
          make test build-dmg 2>&1 | tee "$RUNNER_TEMP/chat-verification/test-build.log"
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Promote verified implementation to main
        if: success() && steps.source.outputs.present == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil, subprocess
          m = json.loads(pathlib.Path('.chat-update/manifest.json').read_text())
          subprocess.run(['git','add','--',*m['allowed']],check=True)
          changed = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if set(changed)-set(m['allowed']):
              raise SystemExit('Unapproved source paths; promotion stopped')
          shutil.rmtree('.chat-update')
          subprocess.run(['git','add','-u','--','.chat-update'],check=True)
          PY
          git diff --cached --check
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'Main changed; refusing to overwrite newer work'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement approved chat-first task workspace and dependency controls'
          git push origin HEAD:main
          git rev-parse HEAD | tee "$RUNNER_TEMP/chat-verification/implementation-commit.txt"
      - name: Collect inspectable source and diagnostics
        if: always() && steps.source.outputs.present == 'true'
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/chat-verification/verified-source.tar.gz" --exclude=target --exclude=node_modules --exclude=dist src-tauri src-ui scripts docs README.md README_zh.md Makefile
          git status --short > "$RUNNER_TEMP/chat-verification/git-status.txt"
      - uses: actions/upload-artifact@v4
        if: always() && steps.source.outputs.present == 'true'
        with:
          name: chat-workspace-verification
          path: ${{ runner.temp }}/chat-verification
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: success() && steps.source.outputs.present == 'true'
        with:
          name: codex-thread-kanban-chat-workspace
          path: |
            src-tauri/target/release/bundle/dmg/*_development.dmg*
          if-no-files-found: error
