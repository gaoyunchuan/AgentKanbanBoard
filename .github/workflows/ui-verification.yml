name: UI Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-verification.yml'
      - 'src-ui/**'
      - 'scripts/browser-bridge*'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix src-ui ci
      - name: Export clean reproducible workspace
        run: |
          tar --exclude='src-tauri/target' --exclude='src-ui/dist' -czf "$RUNNER_TEMP/ui-workspace.tar.gz" AGENTS.md Makefile README.md README_zh.md .gitignore .github src-ui src-tauri docs openspec scripts
      - uses: actions/upload-artifact@v4
        with:
          name: ui-verification-workspace
          path: ${{ runner.temp }}/ui-workspace.tar.gz
          retention-days: 1
      - name: Frontend tests
        run: npm --prefix src-ui test
      - name: Typecheck and build
        run: npm --prefix src-ui run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: src-ui/dist
          retention-days: 7
